name: Daily maintenance

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Compile package
        run: python -m compileall -q worktrail
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel and smoke-test CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          worktrail --version
          worktrail --help

  report:
    name: Publish daily result
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Comment on maintenance log
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        with:
          github-token: ${{ secrets.WORKTRAIL_OWNER_TOKEN }}
          script: |
            const issue_number = 6;
            const testResult = process.env.TEST_RESULT;
            const packageResult = process.env.PACKAGE_RESULT;
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statusFor = result => result === 'success' ? 'PASSED' : result === 'failure' ? 'FAILED' : result.toUpperCase();
            const overall = testResult === 'success' && packageResult === 'success' ? 'PASSED' : 'NEEDS ATTENTION';
            const body = [
              `### Daily check — ${date} (UTC)`,
              '',
              `- **Overall:** ${overall}`,
              `- **Test matrix:** ${statusFor(testResult)} — Python 3.10–3.13 on Ubuntu and Windows`,
              `- **Package build:** ${statusFor(packageResult)} — wheel, source distribution, and installed CLI smoke test`,
              '- **Checks:** install, compile, unit tests, distribution build, and CLI startup',
              `- **Run:** [View actual logs](${runUrl})`,
              '',
              '_Automated report from GitHub Actions. Source code is not changed or merged by this workflow._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
