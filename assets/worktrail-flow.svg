<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Worktrail keeps the thread of your work</title>
  <desc id="desc">A terminal session shows a task being worked on, a checkpoint note being saved, and the next step ready for the next session.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="960" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171916"/>
      <stop offset="1" stop-color="#20221C"/>
    </linearGradient>
    <linearGradient id="terminal" x1="44" y1="90" x2="612" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111410"/>
      <stop offset="1" stop-color="#171B15"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D8F078"/>
      <stop offset="1" stop-color="#A8C95B"/>
    </linearGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".6" fill="#E7E8D8" opacity=".08"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="958" height="338" rx="16" fill="url(#paper)" stroke="#45483B"/>
  <rect x="1" y="1" width="958" height="338" rx="16" fill="url(#grain)"/>

  <text x="34" y="38" fill="#D8F078" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2.1">WORKTRAIL / FIELD NOTES 001</text>
  <text x="34" y="66" fill="#F0F0E7" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Good work leaves a trail.</text>
  <text x="34" y="84" fill="#A6AA9A" font-family="Segoe UI, Arial, sans-serif" font-size="11">Not another task board. A thread back into the work.</text>

  <g>
    <rect x="28" y="105" width="574" height="201" rx="9" fill="url(#terminal)" stroke="#41463A"/>
    <path d="M28 138H602" stroke="#41463A"/>
    <circle cx="46" cy="122" r="3" fill="#D16F57"/>
    <circle cx="58" cy="122" r="3" fill="#D8B35B"/>
    <circle cx="70" cy="122" r="3" fill="#9EBE61"/>
    <text x="88" y="126" fill="#8F9683" font-family="Consolas, 'Liberation Mono', monospace" font-size="10">~/work/project</text>
    <text x="48" y="161" fill="#D8F078" font-family="Consolas, 'Liberation Mono', monospace" font-size="11">$ worktrail start --task "Fix login flow"</text>
    <text x="48" y="184" fill="#8E9684" font-family="Consolas, 'Liberation Mono', monospace" font-size="10">SESSION STARTED  ·  local context only</text>
    <text x="48" y="211" fill="#D8F078" font-family="Consolas, 'Liberation Mono', monospace" font-size="11">$ worktrail checkpoint --note</text>
    <text x="62" y="229" fill="#D8F078" font-family="Consolas, 'Liberation Mono', monospace" font-size="11">"Expired tokens still need tests"</text>
    <rect x="48" y="247" width="528" height="38" rx="5" fill="#23291D" stroke="#47533A"/>
    <path d="M62 266l4 4 8-9" stroke="#D8F078" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="264" fill="#E7E9DB" font-family="Consolas, 'Liberation Mono', monospace" font-size="10">checkpoint saved</text>
    <text x="84" y="277" fill="#9BA58B" font-family="Consolas, 'Liberation Mono', monospace" font-size="9">.worktrail/session.json</text>
  </g>

  <path d="M623 204H654" stroke="#777E68" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M648 198L654 204L648 210" stroke="#777E68" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="668" y="105" width="264" height="201" rx="9" fill="#292B22" stroke="#555A45"/>
    <text x="688" y="130" fill="#A6AA9A" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.2">NEXT TIME</text>
    <path d="M688 144H912" stroke="#4B4F3F"/>
    <circle cx="697" cy="169" r="5" fill="url(#marker)"/>
    <text x="711" y="173" fill="#E9EADF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Pick up the thread</text>
    <text x="688" y="202" fill="#AEB3A1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Task</text>
    <text x="688" y="218" fill="#F0F0E7" font-family="Segoe UI, Arial, sans-serif" font-size="12">Fix login flow</text>
    <text x="688" y="244" fill="#AEB3A1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Last note</text>
    <text x="688" y="260" fill="#F0F0E7" font-family="Segoe UI, Arial, sans-serif" font-size="11">Expired tokens still</text>
    <text x="688" y="275" fill="#F0F0E7" font-family="Segoe UI, Arial, sans-serif" font-size="11">need tests.</text>
    <text x="688" y="292" fill="#D8F078" font-family="Consolas, 'Liberation Mono', monospace" font-size="9">YOUR MACHINE. YOUR CONTEXT.</text>
  </g>
</svg>
